# Version 2 with a Continue point at the edge of every range: the last
# checkpoint index, every coin bit set, the most lives, a level score start
# equal to the score, and the far ends of the respawn and time limits.
format_version = 2
music_volume = 128
effects_volume = 0
muted = 1
dead_zone = 0
window_scale = 1
high_contrast = 0
reduced_motion = 0
ghost = 1
last_level = "levels/02_lugio_02.toml"

[resume]
path = "levels/02_lugio_02.toml"
level_hash = "ffffffffffffffff"
coins = "ffffffffffffffff"
checkpoint = 98
legacy_screen = 1000
score = 2147483647
level_score_start = 2147483647
score_life_next = 0
lives = 999
respawn_x = -1000000.0
respawn_y = 1000000.0
elapsed = 1000000000.0
