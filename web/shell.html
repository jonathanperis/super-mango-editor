<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mango</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #canvas-container {
            position: relative;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
        }
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            text-align: center;
            pointer-events: none;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="canvas"></canvas>
        <div id="status">
            <div class="spinner"></div>
            <div>Loading Super Mango...</div>
        </div>
    </div>

    <script>
        (function() {
        var gameCanvas = document.getElementById('canvas');
        document.addEventListener('keydown', function(event) {
            if (document.activeElement === gameCanvas && !event.ctrlKey && !event.metaKey && event.code !== 'Tab')
                event.preventDefault();
        });
        function showRestart(message) {
            var status = document.getElementById('status');
            status.textContent = message + ' ';
            status.style.display = '';
            status.style.pointerEvents = 'auto';
            var retry = document.createElement('button');
            retry.type = 'button';
            retry.textContent = 'Reload game';
            retry.onclick = function() { window.location.reload(); };
            status.appendChild(retry);
            retry.focus();
        }
        var moduleConfig = {
            canvas: document.getElementById('canvas'),
            onAbort: function() { showRestart('Game startup failed.'); },
            onGameEnded: function(fatal) {
                showRestart(fatal ? 'Game ended with an error.' : 'Run ended.');
            },
            onRuntimeInitialized: function() {
                gameCanvas.tabIndex = 0;
                gameCanvas.focus();
                var replayLevel = null;
                try {
                    replayLevel = sessionStorage.getItem('super-mango-replay-level');
                    if (replayLevel) {
                        sessionStorage.removeItem('super-mango-replay-level');
                        moduleConfig.arguments = ['--level', replayLevel];
                    }
                } catch (e) {
                    console.error('Super Mango: replay boot intent unavailable', e);
                }
                if (moduleConfig.__superMangoDebug) moduleConfig.arguments.push('--debug');
                document.getElementById('status').style.display = 'none';
                setTimeout(function() {
                    if (moduleConfig.__superMangoMainStarted) return;
                    moduleConfig.__superMangoMainStarted = true;
                    try {
                        var result = moduleConfig.callMain(moduleConfig.arguments || []);
                        if (result) showRestart('Game startup failed.');
                    } catch (error) {
                        console.error('Super Mango: startup failed', error);
                        showRestart('Game startup failed.');
                    }
                }, 0);
            },
            print: function(text) {
                console.log(text);
            },
            printErr: function(text) {
                console.error(text);
            }
        };
        moduleConfig.arguments = ['--level', 'levels/00_sandbox_01.toml'];
        window.Module = moduleConfig;
        })();
    </script>
    {{{ SCRIPT }}}
</body>
</html>
