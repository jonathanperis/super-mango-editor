<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- Same-origin only. 'wasm-unsafe-eval' allows WebAssembly compilation but
         not JavaScript eval. emcc minifies this page, so tools/web_csp.py
         replaces the placeholder hash with the built inline boot script's hash.
         blob: images/audio cover Emscripten's preload decoders. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval' 'sha256-MANGO_INLINE_SCRIPT_HASHES'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Mango</title>
    <meta name="description" content="Super Mango, a 2D platformer written in C, running in your browser as WebAssembly. Keyboard, gamepad and touch controls.">
    <!-- This bare page shows the same game as the website's home page. Search
         engines should list that page, which explains what the game is, and
         not this one or the copies people serve from a release archive. -->
    <meta name="robots" content="noindex">
    <!-- The .wasm and .data files are most of the download, and
         super-mango.js asks for them only once it has loaded and run. Start
         both now. Emscripten fetches them in CORS mode with same-origin
         credentials, which is what crossorigin gives a preload, so it
         reuses these responses instead of downloading again.
         The MANGO_ASSET_QUERY marker (written between two @ signs) is filled
         in by tools/web_shell.py when the page is built: it becomes
         "?v=<commit>" (or nothing in a local build), the
         same text the boot script appends to every game file's address, so a
         browser that cached an older deploy cannot mix old and new files. -->
    <link rel="preload" href="super-mango.wasm@MANGO_ASSET_QUERY@" as="fetch" crossorigin>
    <link rel="preload" href="super-mango.data@MANGO_ASSET_QUERY@" as="fetch" crossorigin>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #1a1a2e;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        #canvas-container {
            position: relative;
            /* 132 px of the viewport stays free for the touch pad. */
            width: min(800px, 100%, max(184px, calc((100svh - 132px) * 4 / 3)));
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        /* And 44 px more for the Fullscreen button under the game, only
           where the boot script shows it: it stays hidden in browsers
           without element fullscreen (iPhone Safari), where the game gets
           that room. */
        #canvas-container.with-fullscreen-button {
            width: min(800px, 100%, max(184px, calc((100svh - 176px) * 4 / 3)));
        }
        canvas {
            display: block;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            max-width: 100%;
            height: auto;
            touch-action: none;
        }
        /* The container, not the canvas, goes fullscreen: the canvas then
           keeps its own aspect ratio, so the browser's mouse and touch
           coordinates still cover exactly the drawn picture, and the touch
           controls come along. */
        #canvas-container:fullscreen {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #000;
            box-shadow: none;
        }
        #canvas-container:fullscreen canvas {
            width: min(100vw, calc(100vh * 4 / 3));
            max-width: none;
        }
        /* With the touch pad shown, the picture leaves room for it below:
           two rows of 48 px buttons, the gap and the padding, the same
           132 px the windowed layout keeps for it. */
        #canvas-container:fullscreen:has(.mango-touch-controls) canvas {
            width: min(100vw, calc((100vh - 132px) * 4 / 3));
        }
        #canvas-container:fullscreen .mango-touch-controls {
            width: min(100vw, 800px);
        }
        #fullscreen-btn {
            margin-top: 12px;
            padding: 6px 14px;
            font: inherit;
            font-size: 14px;
            color: #fff;
            background: #2a2a4a;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
        }
        #fullscreen-btn:focus-visible {
            outline: 2px solid #ffd700;
            outline-offset: 2px;
        }
        #status {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            text-align: center;
            pointer-events: none;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 4px solid #333;
            border-top-color: #ffd700;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        /* People who ask their system for less motion get a still ring: the
           text beside it already says that the game is loading. */
        @media (prefers-reduced-motion: reduce) {
            .spinner { animation: none; }
        }
        #status button {
            display: block;
            margin: 12px auto 0;
            padding: 6px 14px;
            font: inherit;
            font-size: 14px;
            color: #fff;
            background: #2a2a4a;
            border: 1px solid #555;
            border-radius: 4px;
            cursor: pointer;
        }
        #status button:focus-visible {
            outline: 2px solid #ffd700;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div id="canvas-container">
        <canvas id="canvas" role="application" aria-label="Super Mango game canvas - loading"></canvas>
        <div id="touch-controls"></div>
        <!-- role="status" with aria-live="polite" makes a screen reader read
             the text whenever it changes (loading, running, failed) without
             interrupting what it was saying. The spinner is decoration. -->
        <div id="status">
            <div class="spinner" aria-hidden="true"></div>
            <div id="status-text" role="status" aria-live="polite">Loading Super Mango...</div>
        </div>
    </div>
    <button id="fullscreen-btn" type="button" hidden>Fullscreen</button>

    <!-- tools/web_shell.py replaces the marker comment below with the whole of
         web/boot.js, the boot sequence this page shares with the website's
         home page. What follows it is only what this page owns: its
         Fullscreen button and its status text. -->
    <script>
        /*MANGO_BOOT_JS*/
        (function() {
        var gameCanvas = document.getElementById('canvas');
        var status = document.getElementById('status');
        var statusText = document.getElementById('status-text');
        // A page may enter fullscreen only while handling the player's own
        // click or key press, so the game cannot do it from its settings
        // menu; this button does. Browsers without element fullscreen
        // (iPhone Safari) keep it hidden. Esc leaves fullscreen.
        var fullscreenButton = document.getElementById('fullscreen-btn');
        var gameContainer = document.getElementById('canvas-container');
        if (fullscreenButton && document.fullscreenEnabled && gameContainer.requestFullscreen) {
            fullscreenButton.hidden = false;
            gameContainer.classList.add('with-fullscreen-button');
            fullscreenButton.addEventListener('click', function() {
                var request = gameContainer.requestFullscreen();
                if (request && request.catch) request.catch(function() {});
                // Hand the keyboard back to the game.
                gameCanvas.focus({preventScroll: true});
            });
        }
        // The game is not running: say why, and offer the one thing that
        // helps on this page, loading it again.
        function showRestart(message) {
            var spinner = status.querySelector('.spinner');
            if (spinner) spinner.style.display = 'none';
            statusText.textContent = message;
            status.style.display = '';
            status.style.pointerEvents = 'auto';
            var retry = document.createElement('button');
            retry.type = 'button';
            retry.textContent = 'Reload game';
            retry.onclick = function() { window.location.reload(); };
            status.appendChild(retry);
            retry.focus();
        }
        window.SuperMangoBoot.start({
            canvas: gameCanvas,
            touchRoot: document.getElementById('touch-controls'),
            assetQuery: '@MANGO_ASSET_QUERY@',
            // emcc writes this page's script tag for super-mango.js.
            injectScript: false,
            onStatus: function(text) {
                if (text) statusText.textContent = text;
                status.style.display = text ? '' : 'none';
            },
            onFailure: showRestart
        });
        })();
    </script>
    {{{ SCRIPT }}}
</body>
</html>
