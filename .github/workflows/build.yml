name: Build & Release

# ──────────────────────────────────────────────────────────────────────────────
# Triggers:
#   push → main    builds and checks the game, then publishes GitHub Pages
#                  (pages-build/pages-deploy); no release is created.
#   pull_request   builds the game as a check only; no release is created.
#   push tag v*    builds and creates a GitHub Release for that tag.
#   workflow_dispatch builds and creates a GitHub Release tagged from VERSION.
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

  workflow_dispatch:
permissions:
  contents: read

# A new push to a pull request cancels that PR's superseded run. Branch, tag and
# manual runs are keyed by their unique run id, so main checks, the Pages
# deploy jobs at the end of this workflow, and releases are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # DOCS DRIFT
  # docs.yml only runs for PRs touching docs-related paths, so a check there
  # would never report on other PRs. This cheap job always runs, docs-only
  # pull requests included, so the main branch ruleset requires it.
  #
  # On main pushes it also does what the separate "Release freshness" job
  # did: warn (never fail) when main has moved more than RELEASE_STALE_AFTER
  # commits past the latest v* tag it contains, so a long-unreleased main is
  # noticed. See docs/wiki/release-checklist.md for the release cadence this
  # nudges towards. Only main pushes fetch the full history it needs.
  # ────────────────────────────────────────────────────────────────────────────
  docs-drift:
    name: Docs drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history and tags on main pushes, so the latest tag and the
          # distance below are real; one commit everywhere else.
          fetch-depth: ${{ (github.ref == 'refs/heads/main' && github.event_name == 'push') && 0 || 1 }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # The drift checks, then the unit tests of the checkers themselves
      # (tests/docs_drift_unit_test.py); see the docs-drift target.
      - name: Check semantic docs drift
        run: make docs-drift

      - name: Warn when main is far past the latest release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        continue-on-error: true
        env:
          RELEASE_STALE_AFTER: '50'
        run: |
          latest=$(git describe --tags --abbrev=0 --match 'v*' HEAD 2>/dev/null || true)
          if [ -z "$latest" ]; then
            echo "::warning title=No release yet::main contains no v* tag."
            exit 0
          fi
          ahead=$(git rev-list --count "$latest..HEAD")
          echo "main is $ahead commits past $latest" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$ahead" -gt "$RELEASE_STALE_AFTER" ]; then
            echo "::warning title=Release is stale::main is $ahead commits past $latest (more than $RELEASE_STALE_AFTER). Consider cutting a release; see docs/wiki/release-checklist.md."
          fi

  # ────────────────────────────────────────────────────────────────────────────
  # CHANGED PATHS
  # Decides whether a pull request touches anything the C jobs build or test.
  # `code` is 'false' only for a pull request whose every changed file is
  # documentation: docs/wiki/, docs/archive/, docs/README.md, .specs/, or a
  # Markdown file at the top of the repository or in .github/ (except
  # THIRD_PARTY_NOTICES.md, which every release archive packs). Anything
  # else, docs/src/ and docs/package.json included (make test reads both),
  # counts as code. Pushes to main, tags and manual runs always say 'true',
  # and any failure here says 'true' too: the jobs below run unless this job
  # positively found a docs-only change.
  #
  # The jobs that use it skip their work rather than fail, so the required
  # checks still report: Sanitizers is skipped through a job-level `if:` (a
  # skipped job counts as passing). The build matrix is not, because a matrix
  # job skipped that way reports one check named "Build (${{ matrix.platform
  # }})" and the four required "Build (<platform>)" checks would wait
  # forever; instead each leg runs on a Linux runner and skips every step.
  # Docs drift above and docs.yml's site build still run on docs-only pull
  # requests.
  # ────────────────────────────────────────────────────────────────────────────
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.classify.outputs.code }}
    steps:
      # A pull request's checkout is the merge commit, whose first parent is
      # the base branch, so two commits are enough for the diff below.
      # --no-renames lists both sides of a rename, so moving a source file
      # into docs/ still counts as a code change.
      - name: Checkout source
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 2

      - name: Classify the changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          code=true
          if [ "$EVENT_NAME" = "pull_request" ] && files=$(git diff --name-only --no-renames HEAD^1 HEAD) && [ -n "$files" ]; then
            code=false
            while IFS= read -r file; do
              case "$file" in
                THIRD_PARTY_NOTICES.md) code=true ;;
                docs/wiki/*|docs/archive/*|docs/README.md|.specs/*|.github/*.md) ;;
                */*) code=true ;;
                *.md) ;;
                *) code=true ;;
              esac
            done <<< "$files"
            printf '%s\n' "$files" | sed 's/^/  /'
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

  # ────────────────────────────────────────────────────────────────────────────
  # BUILD JOB
  # Compiles the game on Linux (x86_64), macOS (arm64), Windows (x86_64, GCC),
  # and WebAssembly in parallel. Every leg here ships a release archive, so the
  # release job waits for all of them; the Windows Clang check lives in the
  # separate windows-extras job below.
  # Runs on every push to main AND every pull request. On a docs-only pull
  # request (see the changes job) each leg runs on a Linux runner and skips
  # every step, so the four required checks still report.
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    needs: changes
    # Runs even when the changes job failed: its output is then empty, which
    # is not 'false', so every step below runs.
    if: ${{ !cancelled() }}
    runs-on: ${{ needs.changes.outputs.code == 'false' && 'ubuntu-latest' || matrix.os }}
    # A leg takes 1 to 6 minutes with raylib restored from the cache. Pull
    # requests only restore what main saved, so a pull request that changes
    # the cache key (the raylib pin, its patches, the toolchain) builds
    # raylib from source on every push, and the Windows legs do that under
    # MSYS2 in well over 20 minutes. The job limit leaves room for that; a
    # hung test is still stopped much sooner by its step's own timeout.
    timeout-minutes: 60

    strategy:
      fail-fast: false   # let all platforms finish even if one fails
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux x86_64
            artifact: super-mango-linux-x86_64
            target: native
            cc: clang
            extra_cflags: -Werror
            package: true
            # The compiled-raylib cache this leg uses (see the raylib-cache
            # action). CodeQL and clang-tidy build the same Linux clang debug
            # tree and pass the same name, so the three share one entry.
            raylib_cache: linux-clang-debug
            # The optimized tree `make dist-native` builds (out/release/raylib).
            raylib_release_cache: linux-clang-release
          - os: macos-latest
            platform: macOS arm64
            artifact: super-mango-macos-arm64
            target: native
            cc: clang
            extra_cflags: -Werror
            package: true
            raylib_cache: macos-clang-debug
            raylib_release_cache: macos-clang-release
          # Ships the Windows release archive. MSYS2 packages are rolling (see
          # the windows-clang job note), so a new GCC warning can fail this leg.
          # Of the three Windows jobs, only this one builds and checks the
          # release zip (dist-native with the bundled UCRT64 DLLs) and gates
          # the release; it tests on the Memory backend. The windows-extras job
          # below covers what it does not.
          - os: windows-latest
            platform: Windows x86_64
            artifact: super-mango-windows-x86_64
            target: native
            cc: gcc
            extra_cflags: -Werror
            package: true
            raylib_cache: windows-gcc-debug
            raylib_release_cache: windows-gcc-release
          - os: ubuntu-latest
            platform: WebAssembly
            artifact: super-mango-wasm
            target: wasm
            cc: emcc
            extra_cflags: ''
            package: true
            # Only the source archive is cached for this leg: setup-emsdk
            # installs the SDK under a new temporary folder on every run, so
            # a restored CMake build tree would name an emcc that no longer
            # exists and its reconfigure would fail.
            raylib_cache: ''
            raylib_release_cache: ''

    env:
      # Warnings fail CI (see extra_cflags above); local builds stay tolerant.
      EXTRA_CFLAGS: ${{ matrix.extra_cflags }}
      EXTRA_WEB_CFLAGS: -Werror
      # One checksum-verified raylib source archive shared by every build
      # directory and restored from the Actions cache below.
      RAYLIB_ARCHIVE: .cache/raylib/source.tar.gz
      # Compile in parallel: hosted runners have 3-4 cores and every object
      # used to build one at a time. Test recipes still run their programs
      # one after another. No --output-sync: it would hold back the output
      # of a hanging test, and macOS's make 3.81 does not have it.
      MAKEFLAGS: -j4
      MANGO_CC: ${{ matrix.cc }}
      # The Web page asks for its .js/.wasm/.data files as <name>?v=<commit>
      # (see WEB_ASSET_VERSION in the Makefile), so a browser that cached an
      # older deploy cannot pair an old file with a new one. Only `make web`
      # reads it.
      WEB_ASSET_VERSION: ${{ github.sha }}
      # 'false' on a docs-only pull request: every step below is skipped.
      CODE_CHANGED: ${{ needs.changes.outputs.code }}

    steps:
      - name: Docs-only pull request, nothing to build
        if: env.CODE_CHANGED == 'false'
        run: echo "Only documentation changed; the build, tests and packaging are skipped."

      # Check out the repository so the runner has access to the source code.
      - name: Checkout source
        if: env.CODE_CHANGED != 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Release zips date every entry with SOURCE_DATE_EPOCH (see
      # tools/package_release.py), so the same commit packs the same bytes.
      - name: Date release archives by the commit
        if: env.CODE_CHANGED != 'false'
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      # MSYS2 provides its own Python on Windows; pin the runner Python elsewhere.
      - name: Setup Python
        if: env.CODE_CHANGED != 'false' && (runner.os != 'Windows')
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # ── Linux dependency install ────────────────────────────────────────────
      # Build the pinned raylib source against GLFW/OpenGL system interfaces.
      # The package list and the Xvfb/PulseAudio start-up live in two local
      # actions (.github/actions/), shared with the sanitizers job.
      - name: Install dependencies (Linux)
        if: env.CODE_CHANGED != 'false' && (matrix.target == 'native' && runner.os == 'Linux')
        uses: ./.github/actions/install-linux-deps
        with:
          display: 'true'

      - name: Start rendered-test display and audio (Linux)
        if: env.CODE_CHANGED != 'false' && (matrix.target == 'native' && runner.os == 'Linux')
        uses: ./.github/actions/setup-linux-display

      # ── macOS dependency install ────────────────────────────────────────────
      # Homebrew is pre-installed on macOS GitHub runners.
      - name: Install dependencies (macOS)
        if: env.CODE_CHANGED != 'false' && (runner.os == 'macOS')
        run: cmake --version

      # ── Windows dependency install ──────────────────────────────────────────
      # The local action installs MSYS2's UCRT64 environment with the MinGW-w64
      # compiler and the pinned-source build tools, and prints their versions.
      - name: Install dependencies (Windows)
        if: env.CODE_CHANGED != 'false' && (runner.os == 'Windows')
        uses: ./.github/actions/setup-msys2-toolchain

      # The pinned source archive (.cache/raylib, every leg) and the compiled
      # raylib of the debug/test trees: out/raylib (desktop) and, on macOS and
      # Windows, out/headless/raylib (Memory backend tests). Without the
      # compiled trees, Windows built raylib from scratch two or three times
      # per job. The action explains why a restored tree is safe to reuse and
      # why only runs on main save. It comes after the toolchain steps because
      # its fingerprint asks this leg's compiler (matrix.cc) for its version,
      # which on Windows needs the MSYS2 shell.
      - name: Cache raylib
        if: env.CODE_CHANGED != 'false'
        uses: ./.github/actions/raylib-cache
        with:
          variant: ${{ matrix.raylib_cache }}
          cc: ${{ matrix.cc }}

      # The optimized raylib tree `make dist-native` links (out/release/raylib),
      # in an entry of its own (variant *-release). Without it "Package release
      # archive" rebuilt raylib on every run (22-51 s). The source archive was
      # handled by the step above.
      - name: Cache release raylib
        if: env.CODE_CHANGED != 'false' && (matrix.raylib_release_cache != '')
        uses: ./.github/actions/raylib-cache
        with:
          variant: ${{ matrix.raylib_release_cache }}
          cc: ${{ matrix.cc }}
          paths: out/release/raylib
          source: 'false'

      # ── Emscripten SDK install (WebAssembly) ────────────────────────────────
      # The same emcc toolchain builds raylib's Web backend and the application.
      - name: Install Emscripten SDK
        if: env.CODE_CHANGED != 'false' && (matrix.target == 'wasm')
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          # renovate: datasource=github-tags depName=emscripten-core/emsdk
          version: 6.0.13

      - name: Verify Emscripten
        if: env.CODE_CHANGED != 'false' && (matrix.target == 'wasm')
        run: emcc --version

      # The Node.js version is the one line in the repository's .node-version
      # file; every workflow reads it from there (Renovate updates that file).
      - name: Install Node.js for host contracts and WebAssembly smoke
        if: env.CODE_CHANGED != 'false'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # ── Compile (Linux / macOS) ─────────────────────────────────────────────
      # Produces out/super-mango via the project Makefile.
      - name: Build (Linux / macOS)
        if: env.CODE_CHANGED != 'false' && (matrix.target == 'native' && runner.os != 'Windows')
        run: make

      # The tests take about two minutes. A step limit stops a test that
      # hangs (a window that never opens, say) after 10 minutes and leaves
      # its output in the log, instead of waiting for the job limit.
      - name: Desktop tests (Linux virtual display)
        if: env.CODE_CHANGED != 'false' && (matrix.target == 'native' && runner.os == 'Linux')
        timeout-minutes: 10
        run: make test

      # The real macOS desktop backend runs in the separate "Desktop backend"
      # job below; this gate keeps the deterministic software backend.
      - name: Software-rendered tests (macOS)
        if: env.CODE_CHANGED != 'false' && (runner.os == 'macOS')
        timeout-minutes: 10
        run: make test OUTDIR=out/headless RAYLIB_PLATFORM=memory

      - name: Diagnose macOS native test failure
        if: env.CODE_CHANGED != 'false' && (failure() && runner.os == 'macOS')
        continue-on-error: true
        timeout-minutes: 2
        env:
          MANGO_TEST_WINDOW: '1'
        run: lldb --batch -o run -k "thread backtrace all" -- out/headless/session-test

      - name: Validate levels (Linux / macOS)
        if: env.CODE_CHANGED != 'false' && (matrix.target == 'native' && runner.os != 'Windows')
        run: make validate-levels

      - name: Build editor (Linux / macOS)
        if: env.CODE_CHANGED != 'false' && (matrix.target == 'native' && runner.os != 'Windows')
        run: make editor

      - name: Desktop smoke (Linux virtual display)
        if: env.CODE_CHANGED != 'false' && (matrix.target == 'native' && runner.os == 'Linux')
        run: make smoke SMOKE_FRAMES=5 SMOKE_SEED=1

      - name: Software-rendered smoke (macOS)
        if: env.CODE_CHANGED != 'false' && (runner.os == 'macOS')
        run: make smoke OUTDIR=out/headless RAYLIB_PLATFORM=memory SMOKE_FRAMES=5 SMOKE_SEED=1

      - name: Scripted smoke scenarios (Linux)
        if: env.CODE_CHANGED != 'false' && (matrix.target == 'native' && runner.os == 'Linux')
        run: make scripted-smoke SMOKE_FRAMES=5 SMOKE_SEEDS="1 7 23"

      # ── Compile (Windows) ───────────────────────────────────────────────────
      # The msys2 shell keeps the UCRT64 compiler/CMake/MinGW make on PATH.
      - name: Build (Windows)
        if: env.CODE_CHANGED != 'false' && (runner.os == 'Windows')
        shell: msys2 {0}
        run: make CC="$MANGO_CC"

      - name: Software-rendered tests (Windows)
        if: env.CODE_CHANGED != 'false' && (runner.os == 'Windows')
        timeout-minutes: 5
        shell: msys2 {0}
        run: make test CC="$MANGO_CC" OUTDIR=out/headless RAYLIB_PLATFORM=memory

      # The level checker is C and reuses the objects built above, so it
      # must use the same compiler.
      - name: Validate levels (Windows)
        if: env.CODE_CHANGED != 'false' && (runner.os == 'Windows')
        shell: msys2 {0}
        run: make validate-levels CC="$MANGO_CC"

      - name: Build editor (Windows)
        if: env.CODE_CHANGED != 'false' && (runner.os == 'Windows')
        shell: msys2 {0}
        run: make editor CC="$MANGO_CC"

      - name: Software-rendered smoke (Windows)
        if: env.CODE_CHANGED != 'false' && (runner.os == 'Windows')
        shell: msys2 {0}
        run: make smoke CC="$MANGO_CC" OUTDIR=out/headless RAYLIB_PLATFORM=memory SMOKE_FRAMES=5 SMOKE_SEED=1

      # ── Compile (WebAssembly) ───────────────────────────────────────────────
      # Uses the 'web' Makefile target with emcc. Assets are bundled into
      # the .data file via --preload-file.
      - name: Build (WebAssembly)
        if: env.CODE_CHANGED != 'false' && (matrix.target == 'wasm')
        run: make web

      - name: Smoke test (WebAssembly artifacts)
        if: env.CODE_CHANGED != 'false' && (matrix.target == 'wasm')
        run: python3 tools/check_wasm_artifacts.py

      # dist-native builds isolated optimized game/editor binaries and collects
      # Windows runtime DLLs and notices directly into the builder archive.
      # Package standalone release archives. Native archives include the game
      # binary plus assets/, levels/, LICENSE, and a short run README so users
      # do not need to clone the repository just to play. WebAssembly archives
      # include the generated HTML/JS/WASM/data artifacts.
      - name: Package release archive (Linux / macOS)
        if: env.CODE_CHANGED != 'false' && (matrix.target == 'native' && runner.os != 'Windows')
        env:
          RELEASE_PLATFORM: ${{ matrix.artifact }}
        run: make dist-native

      - name: Package release archive (Windows)
        if: env.CODE_CHANGED != 'false' && (runner.os == 'Windows' && matrix.package)
        shell: msys2 {0}
        env:
          RELEASE_PLATFORM: ${{ matrix.artifact }}
          RELEASE_DLL_DIR: /ucrt64/bin
        run: make dist-native CC="$MANGO_CC"

      # dist-wasm depends on web, so this reuses the verified build above.
      - name: Package release archive (WebAssembly)
        if: env.CODE_CHANGED != 'false' && (matrix.target == 'wasm')
        env:
          RELEASE_PLATFORM: ${{ matrix.artifact }}
        run: |
          make dist-wasm
          python3 tools/check_wasm_artifacts.py --zip "dist/$RELEASE_PLATFORM.zip"

      # Upload the standalone zip as a workflow artifact. retention-days: 1 keeps
      # PR build storage low; releases immediately reattach the zip assets.
      - name: Upload release archive
        if: env.CODE_CHANGED != 'false' && (matrix.package)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # SANITIZERS JOB
  # AddressSanitizer, UndefinedBehaviorSanitizer and LeakSanitizer over the
  # native tests, the fuzz seeds and a rendered smoke of every level and the
  # editor. It used to be one more serial step in the Linux build leg; as its
  # own job it runs beside the build matrix. Undefined behaviour is fatal
  # (see SANITIZE_CFLAGS in the Makefile). Releases and Pages wait for it, as
  # they did when it lived in the Linux leg.
  # ────────────────────────────────────────────────────────────────────────────
  sanitizers:
    name: Sanitizers (Linux x86_64)
    # Skipped (which counts as passing) on a docs-only pull request; runs when
    # the changes job failed, since its empty output is not 'false'.
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45  # see the build job

    env:
      EXTRA_CFLAGS: -Werror
      RAYLIB_ARCHIVE: .cache/raylib/source.tar.gz
      MAKEFLAGS: -j4  # see the build job

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          display: 'true'

      # The sanitized raylib takes longest to compile, so it is cached in its
      # own entry (the instrumented library is not the one the build job
      # makes). See the raylib-cache action for what the key covers.
      - name: Cache raylib
        uses: ./.github/actions/raylib-cache
        with:
          variant: linux-clang-sanitize
          paths: out-sanitize/raylib

      - name: Start rendered-test display and audio
        uses: ./.github/actions/setup-linux-display

      - name: Install Node.js for host contracts
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # FUZZ_MUTATIONS=50 also replays 50 blind byte mutations of every fuzz
      # seed (about 7,000 inputs, under a minute). The weekly fuzz.yml run
      # searches far deeper; this keeps a little of that on every PR.
      - name: Sanitizer tests and fuzz-seed replay
        timeout-minutes: 10  # see the Linux test step in the build job
        run: make sanitize FUZZ_MUTATIONS=50

      # Reuses the instrumented game, editor and raylib built above.
      - name: Sanitizer smoke (virtual display)
        run: make sanitize-smoke SMOKE_FRAMES=5 SMOKE_SEED=1

  # ────────────────────────────────────────────────────────────────────────────
  # COVERAGE JOB
  # clang source-based coverage of the native tests on the headless Memory
  # backend (no display or audio needed). The per-file llvm-cov table goes to
  # the job summary and a coverage-summary artifact, and COVERAGE_MIN fails
  # the job when the TOTAL line coverage drops below a floor set a little
  # under the measured total (91.2% when the floor was set). Raise the floor
  # as tests are added; it exists to catch a large accidental drop, not to
  # chase a number. A total can hide one file losing its tests, so
  # COVERAGE_TOLERANCE=2 also fails the job when any file falls more than 2
  # points below its line in tools/coverage_baseline.txt (refresh it with
  # `make coverage-baseline` when coverage changes on purpose). It reports
  # separately and stays out of the release `needs`. Skipped on docs-only
  # pull requests (see the changes job).
  # ────────────────────────────────────────────────────────────────────────────
  coverage:
    name: Coverage (Linux x86_64)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      EXTRA_CFLAGS: -Werror
      RAYLIB_ARCHIVE: .cache/raylib/source.tar.gz
      MAKEFLAGS: -j4  # see the build job

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # llvm provides llvm-profdata and llvm-cov for the default clang.
      - name: Install dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          extra: llvm

      - name: Install Node.js for host contracts
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Coverage instruments only project code, so the Memory raylib tree
      # (out/headless/raylib) is an ordinary one and is cached like the others.
      - name: Cache raylib
        uses: ./.github/actions/raylib-cache
        with:
          variant: linux-clang-memory

      - name: Coverage of the native tests
        run: make coverage CC=clang OUTDIR=out/headless RAYLIB_PLATFORM=memory COVERAGE_MIN=90 COVERAGE_TOLERANCE=2

      - name: Publish the coverage summary
        if: always()
        run: |
          summary=out/headless/coverage/summary.txt
          [ -f "$summary" ] || exit 0
          {
            echo "### Native test coverage (llvm-cov, Memory backend)"
            echo
            echo '```text'
            cat "$summary"
            echo '```'
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          # The same comparison the coverage step made, as a table: report
          # only here, so this step never fails on its own.
          python3 tools/check_coverage_baseline.py "$summary" --markdown "$GITHUB_STEP_SUMMARY" > /dev/null

      - name: Upload the coverage summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-summary
          path: out/headless/coverage/summary.txt
          if-no-files-found: ignore
          retention-days: 14

  # ────────────────────────────────────────────────────────────────────────────
  # WINDOWS EXTRAS JOB
  # Two informational Windows checks in one job, so they share one runner,
  # one MSYS2 install and one checkout. It ships nothing and stays out of the
  # release `needs`: a failure here reports without blocking a release.
  # Skipped on docs-only pull requests (see the changes job).
  #
  # 1. Clang -Werror. Builds and tests with UCRT64 Clang, the Makefile's local
  #    Windows default. MSYS2 is a rolling distribution (the
  #    setup-msys2-toolchain action keeps `update: true`, with unversioned
  #    pacman packages; old package versions are not reliably installable),
  #    so a new Clang release can introduce warnings with no source change.
  #    That action prints the exact compiler for triage. What only this half
  #    catches: Clang's warnings in the _WIN32-only code. Linux and macOS
  #    Clang never compile those branches, and the build leg uses GCC, whose
  #    warning set differs. It also proves that a plain `make` on Windows
  #    (whose default CC is this Clang) still builds and passes.
  #
  # 2. Desktop backend (Mesa). The gating build legs test macOS and Windows on
  #    raylib's Memory backend. This half runs the same suites on the real
  #    GLFW/OpenGL backend on Windows with GCC, using Mesa's llvmpipe software
  #    OpenGL as an opengl32.dll drop-in beside the binaries and miniaudio's
  #    null playback device (RAYLIB_AUDIO=null), because the hosted VM has no
  #    sound hardware. What only this half catches: the real GLFW window,
  #    OpenGL and input code on Windows, and the scripted smoke scenarios,
  #    which no other Windows job runs. macOS is not included: GitHub's hosted
  #    macOS VMs have a window server but no OpenGL pixel format ("NSGL:
  #    Failed to find a suitable pixel format"), so GLFW cannot create the
  #    window. The real macOS backend is verified locally.
  #
  # The halves share out/ and out/headless/: the object flag stamps record the
  # compiler, so the GCC half recompiles what Clang built, and each raylib
  # tree has its own folder (out/raylib for Clang, out/raylib-nullaudio for
  # the null-audio GCC build). The Mesa steps run even when a Clang step
  # failed (`!cancelled()`), so one run reports both halves.
  # ────────────────────────────────────────────────────────────────────────────
  windows-extras:
    name: Windows x86_64 extras (clang -Werror, Mesa desktop backend)
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.code != 'false' }}
    runs-on: windows-latest
    # The two former jobs had 60 and 45 minutes, each sized for building its
    # raylib trees from source under MSYS2 when the cache key changes; one
    # job that may build both needs their sum, less the shared setup.
    timeout-minutes: 90

    env:
      EXTRA_CFLAGS: -Werror
      RAYLIB_ARCHIVE: .cache/raylib/source.tar.gz
      MAKEFLAGS: -j4  # see the build job

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # No Setup Python step: MSYS2's UCRT64 Python runs the tools, as in the
      # build job's Windows leg. Clang comes on top of the usual GCC set.
      - name: Install MSYS2 with Clang
        uses: ./.github/actions/setup-msys2-toolchain
        with:
          clang: 'true'

      - name: Install Node.js for host contracts
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Desktop and Memory raylib trees, cached as in the build job. The
      # rolling toolchain changes the fingerprint, and so the key, whenever
      # MSYS2 ships a new Clang or CMake.
      - name: Cache raylib (clang)
        uses: ./.github/actions/raylib-cache
        with:
          variant: windows-clang-debug
          cc: clang

      # RAYLIB_AUDIO=null builds both trees under their -nullaudio names
      # (desktop GLFW and Memory). The fingerprint reads the raylib options,
      # so it sees the same RAYLIB_AUDIO as the steps that build them.
      - name: Cache raylib (gcc, null audio)
        uses: ./.github/actions/raylib-cache
        env:
          RAYLIB_AUDIO: 'null'
        with:
          variant: windows-gcc-nullaudio
          cc: gcc
          source: 'false'
          paths: |
            out/raylib-nullaudio
            out/headless/raylib-nullaudio

      # ── 1. Clang -Werror ───────────────────────────────────────────────────
      - name: Build with -Werror (Windows clang)
        run: make CC=clang

      - name: Software-rendered tests (Windows clang)
        timeout-minutes: 5
        run: make test CC=clang OUTDIR=out/headless RAYLIB_PLATFORM=memory

      - name: Validate levels (Windows clang)
        run: make validate-levels CC=clang

      - name: Build editor with -Werror (Windows clang)
        run: make editor CC=clang

      - name: Software-rendered smoke (Windows clang)
        run: make smoke CC=clang OUTDIR=out/headless RAYLIB_PLATFORM=memory SMOKE_FRAMES=5 SMOKE_SEED=1

      # ── 2. Desktop backend (GCC, Mesa, null audio) ─────────────────────────
      # Third-party Actions are allowlisted for this repository, so Mesa is
      # fetched directly from the pinned mesa-dist-win release and checked
      # against its published SHA-256. Windows loads opengl32.dll from the
      # executable's directory first, so the drop-in only affects out/.
      - name: Install Mesa software OpenGL next to the binaries (Windows)
        if: ${{ !cancelled() }}
        shell: pwsh
        env:
          # renovate-attachment: datasource=github-release-attachments depName=pal1000/mesa-dist-win
          MESA_VERSION: 26.0.8
          MESA_SHA256: a438c26c2752726916e455f9ad121f8a7e3cfecf8626251abf8e5b3e129d8497
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($hash -ne $env:MESA_SHA256) { throw "Mesa archive checksum mismatch: $hash" }
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa'
          7z x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed with $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item -Path (Join-Path $mesa 'x64\*.dll') -Destination out
          if (-not (Test-Path out\opengl32.dll)) { throw 'Mesa opengl32.dll missing' }
          "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Windows scripted smoke has no OpenGL dependency, so it runs first on
      # the deterministic Memory backend. Hosted Windows VMs have no audio
      # endpoint and the game requires an audio device to start, so these
      # steps build with miniaudio's null playback device (see build-system.md).
      - name: Scripted smoke scenarios (Windows, Memory backend)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          RAYLIB_AUDIO: 'null'
        run: make scripted-smoke CC=gcc OUTDIR=out/headless RAYLIB_PLATFORM=memory SMOKE_FRAMES=5 SMOKE_SEEDS="1 7 23"

      - name: Desktop tests (Windows, Mesa)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          RAYLIB_AUDIO: 'null'
        run: make test CC=gcc

      - name: Desktop smoke and scripted scenarios (Windows, Mesa)
        if: ${{ !cancelled() }}
        timeout-minutes: 10
        env:
          RAYLIB_AUDIO: 'null'
        run: |
          make smoke CC=gcc SMOKE_FRAMES=5 SMOKE_SEED=1
          make scripted-smoke CC=gcc SMOKE_FRAMES=5 SMOKE_SEEDS="1 7 23"

  # ────────────────────────────────────────────────────────────────────────────
  # CHECKSUMS AND PROVENANCE JOB
  # Only this job can mint OIDC tokens and write attestations. It runs no
  # third-party actions and does not get repository write access. It waits
  # for every job the release waits for, so a failing gate mints nothing.
  # ────────────────────────────────────────────────────────────────────────────
  provenance:
    name: Checksums and provenance
    # The same gates as the release job (minus provenance itself), so no
    # attestation is minted for archives that a failing gate keeps unpublished.
    needs: [build, sanitizers]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: super-mango-*
          merge-multiple: true
          path: dist/

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum super-mango-linux-x86_64.zip super-mango-macos-arm64.zip \
            super-mango-windows-x86_64.zip super-mango-wasm.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # RELEASE JOB
  # Runs only for explicit release events: pushed v* tags or manual dispatch.
  # Waits for all build matrix legs, the sanitizers and the provenance job, then
  # creates a GitHub Release with the standalone platform archives and
  # SHA256SUMS attached.
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build, sanitizers, provenance]
    # Guard: skip normal branch pushes and PR checks. Publish only from v* tags
    # or an explicit manual workflow dispatch from the protected main branch.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The GITHUB_TOKEN must have write access to repository contents to create
    # tags and releases, and this is the only job that gets it. Its steps are
    # GitHub's own actions (checkout, download-artifact) and the GitHub CLI.
    permissions:
      contents: write

    steps:
      # The release version is the VERSION file (MAJOR.MINOR.PATCH). A pushed
      # v* tag must be v plus that file. A manual dispatch on main creates
      # that tag when it does not exist yet. The v1.0.<commit count> series
      # ended at v1.0.994 (v1.0.845 was the last workflow-run-number tag).
      # Full history is required so an existing tag is visible to this job.
      - name: Checkout source for the release version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Choose the release tag
        id: version
        env:
          PUSHED_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          version=$(tr -d '[:space:]' < VERSION)
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::VERSION must be MAJOR.MINOR.PATCH, found: ${version:-empty}"
            exit 1
          fi
          tag="v${version}"
          if [ -n "$PUSHED_TAG" ]; then
            if [ "$PUSHED_TAG" != "$tag" ]; then
              echo "::error::Tag $PUSHED_TAG does not match VERSION ($tag)."
              exit 1
            fi
            echo "tag=$PUSHED_TAG" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::$tag already exists. Bump VERSION and merge that commit before dispatching again."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      # The four platform archives have distinct names, so they can share dist/.
      - name: Download release archives
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: super-mango-*
          merge-multiple: true
          path: dist/

      - name: Download SHA256SUMS
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: SHA256SUMS
          path: dist/

      # The attested checksums must describe exactly the bytes being published.
      - name: Verify archives against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      # Create the release as a draft with the GitHub CLI that every hosted
      # runner already has, so no third-party code runs in the one job that
      # may write to the repository. A draft has no tag yet; publishing it
      # (the next step) creates the tag at --target when it does not exist.
      # For a pushed v* tag the tag is already there and --target is unused.
      # `gh release create` stops with an error when a file is missing or a
      # release for the tag already exists (delete a draft left by a failed
      # run before running this again), so nothing is published half-made.
      #
      # The notes are written to a file first. The commit and repository
      # reach the script through the environment and are only ever used as
      # text inside that file.
      - name: Create draft GitHub Release with the archives
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<EOF
          Automated release built from commit [\`${RELEASE_COMMIT}\`](${SERVER_URL}/${GH_REPO}/commit/${RELEASE_COMMIT}).

          ### Downloads

          | Platform        | File                                  | Notes                              |
          |-----------------|---------------------------------------|------------------------------------|
          | Linux x86_64    | \`super-mango-linux-x86_64.zip\`        | Extract zip and run \`./super-mango\` |
          | macOS arm64     | \`super-mango-macos-arm64.zip\`         | Extract zip and run \`./super-mango\` |
          | Windows x86_64  | \`super-mango-windows-x86_64.zip\`      | Extract zip; required toolchain DLLs are included |
          | WebAssembly     | \`super-mango-wasm.zip\`                | Serve with any HTTP server          |

          Native builder archives include the game and editor, playable \`assets/\`, campaign/lab \`levels/\`, project and third-party notices, and a short README. Run from the extracted folder. raylib is linked statically; native OS graphics/audio support is required, and Linux dialogs need zenity. Windows bundles required non-system runtime DLLs and their package notices. Reserve assets are excluded; WebAssembly uses the verified \`.data\` payloads.

          ### Verify your download

          \`SHA256SUMS\` lists every archive; each archive also has a GitHub build provenance attestation:

          \`\`\`sh
          sha256sum --check --ignore-missing SHA256SUMS   # macOS: shasum -a 256 --check --ignore-missing SHA256SUMS
          gh attestation verify super-mango-linux-x86_64.zip --repo ${GH_REPO}
          \`\`\`

          macOS binaries are ad-hoc signed, not notarized, so Gatekeeper blocks the first launch (right-click **Open** no longer bypasses this on macOS 15+). First verify the archive with \`SHA256SUMS\` or \`gh attestation verify\` as above, then either launch the binary once and click **Open Anyway** in **System Settings › Privacy & Security**, or run \`xattr -dr com.apple.quarantine super-mango-macos-arm64\` on the extracted folder.
          EOF
          gh release create "$RELEASE_TAG" --draft --target "$RELEASE_COMMIT" \
            --title "Super Mango $RELEASE_TAG" --notes-file "$notes" \
            dist/super-mango-linux-x86_64.zip \
            dist/super-mango-macos-arm64.zip \
            dist/super-mango-windows-x86_64.zip \
            dist/super-mango-wasm.zip \
            dist/SHA256SUMS

      - name: Publish immutable release after asset upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false

  # ────────────────────────────────────────────────────────────────────────────
  # GITHUB PAGES
  # Main pushes and manual runs on main publish the docs site with the game.
  # Both jobs live in this workflow on purpose: the WASM artifact comes from
  # the build job of this same run and the checkout is this run's own commit,
  # so nothing crosses a workflow_run trust boundary (no foreign artifact or
  # pull-request head is ever consumed by a job that can deploy).
  #
  # pages-build runs third-party npm code with read-only permissions;
  # pages-deploy holds the Pages/OIDC permissions and runs no repository code.
  # ────────────────────────────────────────────────────────────────────────────
  pages-build:
    name: Pages build
    needs: [docs-drift, build, sanitizers]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WebAssembly build from this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: super-mango-wasm
          path: wasm-build/

      # Astro 7 checks process.versions.node during docs builds.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      # Bun installs the docs dependencies from the frozen lockfile.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install docs dependencies
        run: bun install --frozen-lockfile
        working-directory: docs

      # docs.yml checks pull requests; on main this job is the only docs
      # build, so it also runs the type/content check.
      - name: Lint docs
        run: bun run lint
        working-directory: docs

      - name: Build docs site
        run: bun run build
        working-directory: docs
        env:
          # NEXT_PUBLIC_GA_ID is a legacy secret name from the former Next.js
          # site; Astro reads PUBLIC_GA_ID. Renaming the mapping requires
          # creating the new repository secret first, then updating this line.
          PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}
          # The home page asks for super-mango.js/.wasm/.data as
          # <name>?v=<commit>, the same commit the build job stamped into the
          # standalone page (WEB_ASSET_VERSION there), so a browser that
          # cached an older deploy cannot mix old and new game files.
          PUBLIC_GAME_ASSET_VERSION: ${{ github.sha }}

      - name: Check built docs links and metadata
        run: bun run check-site
        working-directory: docs

      - name: Copy WASM artifacts into docs output
        run: |
          unzip -q wasm-build/super-mango-wasm.zip -d wasm-build/unpacked
          cp wasm-build/unpacked/super-mango-wasm/super-mango.{html,js,wasm,data} \
            wasm-build/unpacked/super-mango-wasm/super-mango-debug.html docs/out/

      - name: Smoke Pages WASM assembly
        run: |
          test -s docs/out/super-mango.js
          test -s docs/out/super-mango.wasm
          test -s docs/out/super-mango.data
          grep -R "super-mango.js" docs/out/index.html
          python3 -m http.server 4173 --directory docs/out >/tmp/super-mango-pages.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for path in / /super-mango.{html,js,wasm,data} /super-mango-debug.html; do
            curl --retry 5 --retry-delay 1 --retry-connrefused -fsS "http://127.0.0.1:4173$path" >/dev/null
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/out/
          retention-days: 1

  pages-deploy:
    name: Pages deploy
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # One Pages deployment at a time; a newer main run waits, never cancels.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # ────────────────────────────────────────────────────────────────────────────
  # LIVE SITE CHECK
  # After a deploy, load the published game in headless Chromium
  # (tools/live-check/check_live_site.mjs): wait until the page links this
  # commit's assets, then fail on a canvas that never reaches "running", a
  # visible loading line, a console error, page error or failed request, or
  # a game that stops when ArrowRight is held. Known noise (audio waiting for
  # a gesture, ScriptProcessorNode, SwiftShader ReadPixels) is listed in the
  # script. Not a required check: the site is already live when it runs, so
  # a failure is a signal to fix forward, with screenshots in the artifact.
  # ────────────────────────────────────────────────────────────────────────────
  live-site-check:
    name: Live site check
    needs: pages-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out the live-check script
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .node-version
            tools/live-check

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Install Playwright Chromium
        working-directory: tools/live-check
        run: |
          npm ci --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: Check the published game
        working-directory: tools/live-check
        env:
          PAGE_URL: ${{ needs.pages-deploy.outputs.page_url }}
        run: |
          node check_live_site.mjs --url "${PAGE_URL%/}/super-mango.html" \
            --expect-version "$GITHUB_SHA" --timeout-seconds 300 --out "$RUNNER_TEMP/live-check"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-site-check
          path: ${{ runner.temp }}/live-check
          if-no-files-found: warn
          retention-days: 14
