name: Build & Release

# ──────────────────────────────────────────────────────────────────────────────
# Triggers:
#   push → main    builds and checks the game, then publishes GitHub Pages
#                  (pages-build/pages-deploy); no release is created.
#   pull_request   builds the game as a check only; no release is created.
#   push tag v*    builds and creates a GitHub Release for that tag.
#   workflow_dispatch builds and creates a manually versioned GitHub Release.
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

  workflow_dispatch:
permissions:
  contents: read

# A new push to a pull request cancels that PR's superseded run. Branch, tag and
# manual runs are keyed by their unique run id, so main checks, the Pages
# deploy jobs at the end of this workflow, and releases are never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # DOCS DRIFT
  # docs.yml only runs for PRs touching docs-related paths, so a check there
  # would never report on other PRs. This cheap job always runs, so the main
  # branch ruleset requires it.
  # ────────────────────────────────────────────────────────────────────────────
  docs-drift:
    name: Docs drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Check semantic docs drift
        run: make docs-drift

  # ────────────────────────────────────────────────────────────────────────────
  # BUILD JOB
  # Compiles the game on Linux (x86_64), macOS (arm64), Windows (x86_64, GCC),
  # and WebAssembly in parallel. Every leg here ships a release archive, so the
  # release job waits for all of them; the Windows Clang check lives in the
  # separate windows-clang job below.
  # Runs on every push to main AND every pull request.
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      fail-fast: false   # let all platforms finish even if one fails
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux x86_64
            artifact: super-mango-linux-x86_64
            target: native
            cc: clang
            extra_cflags: -Werror
            package: true
          - os: macos-latest
            platform: macOS arm64
            artifact: super-mango-macos-arm64
            target: native
            cc: clang
            extra_cflags: -Werror
            package: true
          # Ships the Windows release archive. MSYS2 packages are rolling (see
          # the windows-clang job note), so a new GCC warning can fail this leg.
          - os: windows-latest
            platform: Windows x86_64
            artifact: super-mango-windows-x86_64
            target: native
            cc: gcc
            extra_cflags: -Werror
            package: true
          - os: ubuntu-latest
            platform: WebAssembly
            artifact: super-mango-wasm
            target: wasm
            cc: emcc
            extra_cflags: ''
            package: true

    env:
      # Warnings fail CI (see extra_cflags above); local builds stay tolerant.
      EXTRA_CFLAGS: ${{ matrix.extra_cflags }}
      EXTRA_WEB_CFLAGS: -Werror
      # One checksum-verified raylib source archive shared by every build
      # directory and restored from the Actions cache below.
      RAYLIB_ARCHIVE: .cache/raylib/source.tar.gz
      MANGO_CC: ${{ matrix.cc }}

    steps:
      # Check out the repository so the runner has access to the source code.
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # MSYS2 provides its own Python on Windows; pin the runner Python elsewhere.
      - name: Setup Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # The archive only changes with the pin; build_raylib.py re-verifies its
      # SHA-256 on every use, so a restored copy cannot inject other sources.
      - name: Cache pinned raylib source archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/raylib
          key: raylib-source-${{ runner.os }}-${{ hashFiles('vendor/raylib/manifest.json', 'vendor/raylib/patches.json', 'tools/build_raylib.py') }}

      # ── Linux dependency install ────────────────────────────────────────────
      # Build the pinned raylib source against GLFW/OpenGL system interfaces.
      - name: Install dependencies (Linux)
        if: matrix.target == 'native' && runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake libgl1-mesa-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            xvfb libgl1-mesa-dri pulseaudio zenity

      # Compiled raylib for the debug/test tree only; release archives always
      # build raylib from source (dist-native uses out/release/raylib). See
      # the sanitizers job for why a restored tree is safe to reuse.
      - name: Fingerprint the raylib toolchain (Linux)
        id: toolchain
        if: matrix.target == 'native' && runner.os == 'Linux'
        run: echo "id=$({ echo "$ImageOS $ImageVersion $GITHUB_WORKSPACE"; clang --version; cmake --version; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache compiled raylib (Linux)
        if: matrix.target == 'native' && runner.os == 'Linux'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/raylib
            !out/raylib/raylib-*/examples
            !out/raylib/raylib-*/projects
          key: raylib-build-linux-debug-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vendor/raylib/manifest.json', 'vendor/raylib/patches.json', 'tools/build_raylib.py', 'Makefile') }}

      - name: Start rendered-test display and audio (Linux)
        if: matrix.target == 'native' && runner.os == 'Linux'
        run: |
          Xvfb :99 -screen 0 1280x1024x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=mango
          pactl set-default-sink mango

      # ── macOS dependency install ────────────────────────────────────────────
      # Homebrew is pre-installed on macOS GitHub runners.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: cmake --version

      # ── Windows dependency install ──────────────────────────────────────────
      # MSYS2 is pre-installed on windows-latest runners. We use the
      # msys2/setup-msys2 action to configure the UCRT64 environment and
      # install the MinGW-w64 compiler and the pinned-source build tools.
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          path-type: inherit

      - name: Download Windows toolchain and build tools
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # Mirrors can time out after partially caching a transaction. Retry
          # without bypassing package signatures or swallowing final failure.
          for attempt in 1 2 3; do
            if pacman --noconfirm -S --needed make mingw-w64-ucrt-x86_64-gcc \
              mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-cmake \
              mingw-w64-ucrt-x86_64-make; then exit 0; fi
          done
          exit 1

      # MSYS2 is a rolling distribution; record the exact compiler so a new
      # -Werror failure can be traced to a toolchain update.
      - name: Record Windows toolchain versions
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          "$MANGO_CC" --version
          pacman -Q mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-cmake

      # ── Emscripten SDK install (WebAssembly) ────────────────────────────────
      # The same emcc toolchain builds raylib's Web backend and the application.
      - name: Install Emscripten SDK
        if: matrix.target == 'wasm'
        uses: emscripten-core/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.9

      - name: Verify Emscripten
        if: matrix.target == 'wasm'
        run: emcc --version

      - name: Install Node.js for host contracts and WebAssembly smoke
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'

      # ── Compile (Linux / macOS) ─────────────────────────────────────────────
      # Produces out/super-mango via the project Makefile.
      - name: Build (Linux / macOS)
        if: matrix.target == 'native' && runner.os != 'Windows'
        run: make

      - name: Desktop tests (Linux virtual display)
        if: matrix.target == 'native' && runner.os == 'Linux'
        run: make test

      # The real macOS desktop backend runs in the separate "Desktop backend"
      # job below; this gate keeps the deterministic software backend.
      - name: Software-rendered tests (macOS)
        if: runner.os == 'macOS'
        run: make test OUTDIR=out/headless RAYLIB_PLATFORM=memory

      - name: Diagnose macOS native test failure
        if: failure() && runner.os == 'macOS'
        continue-on-error: true
        timeout-minutes: 2
        env:
          MANGO_TEST_WINDOW: '1'
        run: lldb --batch -o run -k "thread backtrace all" -- out/headless/session-test

      - name: Validate levels (Linux / macOS)
        if: matrix.target == 'native' && runner.os != 'Windows'
        run: make validate-levels

      - name: Build editor (Linux / macOS)
        if: matrix.target == 'native' && runner.os != 'Windows'
        run: make editor

      - name: Desktop smoke (Linux virtual display)
        if: matrix.target == 'native' && runner.os == 'Linux'
        run: make smoke SMOKE_FRAMES=5 SMOKE_SEED=1

      - name: Software-rendered smoke (macOS)
        if: runner.os == 'macOS'
        run: make smoke OUTDIR=out/headless RAYLIB_PLATFORM=memory SMOKE_FRAMES=5 SMOKE_SEED=1

      - name: Scripted smoke scenarios (Linux)
        if: matrix.target == 'native' && runner.os == 'Linux'
        run: make scripted-smoke SMOKE_FRAMES=5 SMOKE_SEEDS="1 7 23"

      # ── Compile (Windows) ───────────────────────────────────────────────────
      # The msys2 shell keeps the UCRT64 compiler/CMake/MinGW make on PATH.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make CC="$MANGO_CC"

      - name: Software-rendered tests (Windows)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        shell: msys2 {0}
        run: make test CC="$MANGO_CC" OUTDIR=out/headless RAYLIB_PLATFORM=memory

      # The level checker is C and reuses the objects built above, so it
      # must use the same compiler.
      - name: Validate levels (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make validate-levels CC="$MANGO_CC"

      - name: Build editor (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make editor CC="$MANGO_CC"

      - name: Software-rendered smoke (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make smoke CC="$MANGO_CC" OUTDIR=out/headless RAYLIB_PLATFORM=memory SMOKE_FRAMES=5 SMOKE_SEED=1

      # ── Compile (WebAssembly) ───────────────────────────────────────────────
      # Uses the 'web' Makefile target with emcc. Assets are bundled into
      # the .data file via --preload-file.
      - name: Build (WebAssembly)
        if: matrix.target == 'wasm'
        run: make web

      - name: Smoke test (WebAssembly artifacts)
        if: matrix.target == 'wasm'
        run: python3 tools/check_wasm_artifacts.py

      # dist-native builds isolated optimized game/editor binaries and collects
      # Windows runtime DLLs and notices directly into the builder archive.
      # Package standalone release archives. Native archives include the game
      # binary plus assets/, levels/, LICENSE, and a short run README so users
      # do not need to clone the repository just to play. WebAssembly archives
      # include the generated HTML/JS/WASM/data artifacts.
      - name: Package release archive (Linux / macOS)
        if: matrix.target == 'native' && runner.os != 'Windows'
        env:
          RELEASE_PLATFORM: ${{ matrix.artifact }}
        run: make dist-native

      - name: Package release archive (Windows)
        if: runner.os == 'Windows' && matrix.package
        shell: msys2 {0}
        env:
          RELEASE_PLATFORM: ${{ matrix.artifact }}
          RELEASE_DLL_DIR: /ucrt64/bin
        run: make dist-native CC="$MANGO_CC"

      # dist-wasm depends on web, so this reuses the verified build above.
      - name: Package release archive (WebAssembly)
        if: matrix.target == 'wasm'
        env:
          RELEASE_PLATFORM: ${{ matrix.artifact }}
        run: |
          make dist-wasm
          python3 tools/check_wasm_artifacts.py --zip "dist/$RELEASE_PLATFORM.zip"

      # Upload the standalone zip as a workflow artifact. retention-days: 1 keeps
      # PR build storage low; releases immediately reattach the zip assets.
      - name: Upload release archive
        if: matrix.package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # SANITIZERS JOB
  # AddressSanitizer, UndefinedBehaviorSanitizer and LeakSanitizer over the
  # native tests, the fuzz seeds and a rendered smoke of every level and the
  # editor. It used to be one more serial step in the Linux build leg; as its
  # own job it runs beside the build matrix. Undefined behaviour is fatal
  # (see SANITIZE_CFLAGS in the Makefile). Releases and Pages wait for it, as
  # they did when it lived in the Linux leg.
  # ────────────────────────────────────────────────────────────────────────────
  sanitizers:
    name: Sanitizers (Linux x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      EXTRA_CFLAGS: -Werror
      RAYLIB_ARCHIVE: .cache/raylib/source.tar.gz

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache pinned raylib source archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/raylib
          key: raylib-source-${{ runner.os }}-${{ hashFiles('vendor/raylib/manifest.json', 'vendor/raylib/patches.json', 'tools/build_raylib.py') }}

      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang cmake libgl1-mesa-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            xvfb libgl1-mesa-dri pulseaudio zenity

      # The sanitized raylib takes longest to compile, so it is cached. A
      # restored tree is safe to reuse: make still runs tools/build_raylib.py,
      # which re-verifies the archive checksum, re-applies the patches (a no-op
      # when present) and re-runs CMake, and CMake rebuilds whatever its own
      # dependency tracking finds stale. The key must match exactly (no
      # restore-keys): it covers the pin, the patches, the Makefile and build
      # script that choose the CMake options, the runner image, compiler and
      # CMake versions, and the workspace path CMake records, so a changed
      # toolchain, option or path never reuses old objects. Pull requests
      # cannot write caches that main or tags read.
      - name: Fingerprint the raylib toolchain
        id: toolchain
        run: echo "id=$({ echo "$ImageOS $ImageVersion $GITHUB_WORKSPACE"; clang --version; cmake --version; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache compiled sanitizer raylib
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out-sanitize/raylib
            !out-sanitize/raylib/raylib-*/examples
            !out-sanitize/raylib/raylib-*/projects
          key: raylib-build-linux-sanitize-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vendor/raylib/manifest.json', 'vendor/raylib/patches.json', 'tools/build_raylib.py', 'Makefile') }}

      - name: Start rendered-test display and audio
        run: |
          Xvfb :99 -screen 0 1280x1024x24 > "$RUNNER_TEMP/xvfb.log" 2>&1 &
          echo "DISPLAY=:99" >> "$GITHUB_ENV"
          echo "LIBGL_ALWAYS_SOFTWARE=1" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=mango
          pactl set-default-sink mango

      - name: Install Node.js for host contracts
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'

      - name: Sanitizer tests and fuzz-seed replay
        run: make sanitize

      # Reuses the instrumented game, editor and raylib built above.
      - name: Sanitizer smoke (virtual display)
        run: make sanitize-smoke SMOKE_FRAMES=5 SMOKE_SEED=1

  # ────────────────────────────────────────────────────────────────────────────
  # WINDOWS CLANG JOB
  # Builds and tests with UCRT64 Clang, the Makefile's local Windows default,
  # under -Werror. It ships nothing, so it stays out of the release `needs`: a
  # Clang-only warning reports here without blocking a release. MSYS2 is a
  # rolling distribution (setup-msys2 `update: true`, unversioned pacman
  # packages; old package versions are not reliably installable), so a new
  # Clang release can introduce warnings with no source change. The versions
  # step prints the exact compiler for triage.
  # ────────────────────────────────────────────────────────────────────────────
  windows-clang:
    name: Windows x86_64 clang -Werror (rolling MSYS2 toolchain)
    runs-on: windows-latest
    timeout-minutes: 60

    env:
      EXTRA_CFLAGS: -Werror
      RAYLIB_ARCHIVE: .cache/raylib/source.tar.gz

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache pinned raylib source archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/raylib
          key: raylib-source-${{ runner.os }}-${{ hashFiles('vendor/raylib/manifest.json', 'vendor/raylib/patches.json', 'tools/build_raylib.py') }}

      - name: Install MSYS2
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          path-type: inherit

      - name: Download Windows Clang toolchain and build tools
        run: |
          for attempt in 1 2 3; do
            if pacman --noconfirm -S --needed make mingw-w64-ucrt-x86_64-clang \
              mingw-w64-ucrt-x86_64-gcc mingw-w64-ucrt-x86_64-python \
              mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-make; then exit 0; fi
          done
          exit 1

      - name: Record rolling MSYS2 toolchain versions
        run: |
          clang --version
          pacman -Q mingw-w64-ucrt-x86_64-clang mingw-w64-ucrt-x86_64-cmake

      - name: Install Node.js for host contracts
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'

      - name: Build with -Werror (Windows clang)
        run: make CC=clang

      - name: Software-rendered tests (Windows clang)
        timeout-minutes: 5
        run: make test CC=clang OUTDIR=out/headless RAYLIB_PLATFORM=memory

      - name: Validate levels (Windows clang)
        run: make validate-levels CC=clang

      - name: Build editor with -Werror (Windows clang)
        run: make editor CC=clang

      - name: Software-rendered smoke (Windows clang)
        run: make smoke CC=clang OUTDIR=out/headless RAYLIB_PLATFORM=memory SMOKE_FRAMES=5 SMOKE_SEED=1

  # ────────────────────────────────────────────────────────────────────────────
  # DESKTOP BACKEND JOB
  # The gating build legs above test macOS and Windows on raylib's Memory
  # backend. This job runs the same suites on the real GLFW/OpenGL backend on
  # Windows, using Mesa's llvmpipe software OpenGL as an opengl32.dll drop-in
  # beside the binaries and miniaudio's null playback device (RAYLIB_AUDIO=null)
  # because the hosted VM has no sound hardware. Kept separate
  # (and out of the release `needs`) so its results are visible before the
  # owner decides to make it a required check.
  #
  # macOS is not included: GitHub's hosted macOS VMs have a window server but
  # no OpenGL pixel format ("NSGL: Failed to find a suitable pixel format"), so
  # GLFW cannot create the window. The real macOS backend is verified locally.
  # ────────────────────────────────────────────────────────────────────────────
  desktop-backend:
    name: Desktop backend (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: Windows x86_64 Mesa
            extra_cflags: -Werror

    env:
      EXTRA_CFLAGS: ${{ matrix.extra_cflags }}
      RAYLIB_ARCHIVE: .cache/raylib/source.tar.gz
      # Hosted Windows VMs have no audio endpoint, and the game requires an
      # audio device to start. Real GLFW/OpenGL graphics with miniaudio's null
      # playback device keeps every test meaningful (see build-system.md).
      RAYLIB_AUDIO: 'null'

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        if: runner.os != 'Windows'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Cache pinned raylib source archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/raylib
          key: raylib-source-${{ runner.os }}-${{ hashFiles('vendor/raylib/manifest.json', 'vendor/raylib/patches.json', 'tools/build_raylib.py') }}

      - name: Install Node.js for host contracts
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'

      - name: Install MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        with:
          msystem: UCRT64
          update: true
          path-type: inherit

      - name: Download Windows toolchain and build tools
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          for attempt in 1 2 3; do
            if pacman --noconfirm -S --needed make mingw-w64-ucrt-x86_64-gcc \
              mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-cmake \
              mingw-w64-ucrt-x86_64-make; then exit 0; fi
          done
          exit 1

      # Third-party Actions are allowlisted for this repository, so Mesa is
      # fetched directly from the pinned mesa-dist-win release and checked
      # against its published SHA-256. Windows loads opengl32.dll from the
      # executable's directory first, so the drop-in only affects out/.
      - name: Install Mesa software OpenGL next to the binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MESA_VERSION: 26.0.3
          MESA_SHA256: de1ec45c906164de2c046288a8969e83cf2d51d031dc8dfd1f9371bb31cd6755
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'mesa.7z'
          $url = "https://github.com/pal1000/mesa-dist-win/releases/download/$env:MESA_VERSION/mesa3d-$env:MESA_VERSION-release-msvc.7z"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $hash = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($hash -ne $env:MESA_SHA256) { throw "Mesa archive checksum mismatch: $hash" }
          $mesa = Join-Path $env:RUNNER_TEMP 'mesa'
          7z x $archive "-o$mesa" -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "7z failed with $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item -Path (Join-Path $mesa 'x64\*.dll') -Destination out
          if (-not (Test-Path out\opengl32.dll)) { throw 'Mesa opengl32.dll missing' }
          "GALLIUM_DRIVER=llvmpipe" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Windows scripted smoke has no OpenGL dependency, so it runs first on
      # the deterministic Memory backend.
      - name: Scripted smoke scenarios (Windows, Memory backend)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: msys2 {0}
        run: make scripted-smoke CC=gcc OUTDIR=out/headless RAYLIB_PLATFORM=memory SMOKE_FRAMES=5 SMOKE_SEEDS="1 7 23"

      - name: Desktop tests (Windows, Mesa)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: msys2 {0}
        run: make test CC=gcc

      - name: Desktop smoke and scripted scenarios (Windows, Mesa)
        if: runner.os == 'Windows'
        timeout-minutes: 15
        shell: msys2 {0}
        run: |
          make smoke CC=gcc SMOKE_FRAMES=5 SMOKE_SEED=1
          make scripted-smoke CC=gcc SMOKE_FRAMES=5 SMOKE_SEEDS="1 7 23"

  # ────────────────────────────────────────────────────────────────────────────
  # CHECKSUMS AND PROVENANCE JOB
  # Only this job can mint OIDC tokens and write attestations. It runs no
  # third-party actions and does not get repository write access.
  # ────────────────────────────────────────────────────────────────────────────
  provenance:
    name: Checksums and provenance
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      attestations: write
      id-token: write

    steps:
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: super-mango-*
          merge-multiple: true
          path: dist/

      - name: Generate SHA256SUMS
        working-directory: dist
        run: |
          sha256sum super-mango-linux-x86_64.zip super-mango-macos-arm64.zip \
            super-mango-windows-x86_64.zip super-mango-wasm.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/SHA256SUMS

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SHA256SUMS
          path: dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # RELEASE JOB
  # Runs only for explicit release events: pushed v* tags or manual dispatch.
  # Waits for all build matrix legs, the sanitizers and the provenance job, then
  # creates a GitHub Release with the standalone platform archives and
  # SHA256SUMS attached.
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: [build, sanitizers, provenance]
    # Guard: skip normal branch pushes and PR checks. Publish only from v* tags
    # or an explicit manual workflow dispatch from the protected main branch.
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The GITHUB_TOKEN must have write access to repository contents to create
    # tags and releases. Scoping it here follows the principle of least privilege.
    permissions:
      contents: write

    steps:
      # The four platform archives have distinct names, so they can share dist/.
      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: super-mango-*
          merge-multiple: true
          path: dist/

      - name: Download SHA256SUMS
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SHA256SUMS
          path: dist/

      # The attested checksums must describe exactly the bytes being published.
      - name: Verify archives against SHA256SUMS
        working-directory: dist
        run: sha256sum --check --strict SHA256SUMS

      # Create the GitHub Release. The tag is auto-created by the action when
      # softprops/action-gh-release picks up GITHUB_TOKEN automatically.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          draft: true
          name: Super Mango ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          body: |
            Automated release built from commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            ### Downloads

            | Platform        | File                                  | Notes                              |
            |-----------------|---------------------------------------|------------------------------------|
            | Linux x86_64    | `super-mango-linux-x86_64.zip`        | Extract zip and run `./super-mango` |
            | macOS arm64     | `super-mango-macos-arm64.zip`         | Extract zip and run `./super-mango` |
            | Windows x86_64  | `super-mango-windows-x86_64.zip`      | Extract zip; required toolchain DLLs are included |
            | WebAssembly     | `super-mango-wasm.zip`                | Serve with any HTTP server          |

            Native builder archives include the game and editor, playable `assets/`, campaign/lab `levels/`, project and third-party notices, and a short README. Run from the extracted folder. raylib is linked statically; native OS graphics/audio support is required, and Linux dialogs need zenity. Windows bundles required non-system runtime DLLs and their package notices. Reserve assets are excluded; WebAssembly uses the verified `.data` payloads.

            ### Verify your download

            `SHA256SUMS` lists every archive; each archive also has a GitHub build provenance attestation:

            ```sh
            sha256sum --check --ignore-missing SHA256SUMS   # macOS: shasum -a 256 --check --ignore-missing SHA256SUMS
            gh attestation verify super-mango-linux-x86_64.zip --repo ${{ github.repository }}
            ```

            macOS binaries are ad-hoc signed, not notarized, so Gatekeeper blocks the first launch (right-click **Open** no longer bypasses this on macOS 15+). First verify the archive with `SHA256SUMS` or `gh attestation verify` as above, then either launch the binary once and click **Open Anyway** in **System Settings › Privacy & Security**, or run `xattr -dr com.apple.quarantine super-mango-macos-arm64` on the extracted folder.
          files: |
            dist/super-mango-linux-x86_64.zip
            dist/super-mango-macos-arm64.zip
            dist/super-mango-windows-x86_64.zip
            dist/super-mango-wasm.zip
            dist/SHA256SUMS
          fail_on_unmatched_files: true
          overwrite_files: false

      - name: Publish immutable release after asset upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
        run: gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false

  # ────────────────────────────────────────────────────────────────────────────
  # GITHUB PAGES
  # Main pushes and manual runs on main publish the docs site with the game.
  # Both jobs live in this workflow on purpose: the WASM artifact comes from
  # the build job of this same run and the checkout is this run's own commit,
  # so nothing crosses a workflow_run trust boundary (no foreign artifact or
  # pull-request head is ever consumed by a job that can deploy).
  #
  # pages-build runs third-party npm code with read-only permissions;
  # pages-deploy holds the Pages/OIDC permissions and runs no repository code.
  # ────────────────────────────────────────────────────────────────────────────
  pages-build:
    name: Pages build
    needs: [docs-drift, build, sanitizers]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download WebAssembly build from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: super-mango-wasm
          path: wasm-build/

      # Astro 7 checks process.versions.node during docs builds.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'

      # Bun installs the docs dependencies from the frozen lockfile.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install docs dependencies
        run: bun install --frozen-lockfile
        working-directory: docs

      # docs.yml checks pull requests; on main this job is the only docs
      # build, so it also runs the type/content check.
      - name: Lint docs
        run: bun run lint
        working-directory: docs

      - name: Build docs site
        run: bun run build
        working-directory: docs
        env:
          # NEXT_PUBLIC_GA_ID is a legacy secret name from the former Next.js
          # site; Astro reads PUBLIC_GA_ID. Renaming the mapping requires
          # creating the new repository secret first, then updating this line.
          PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

      - name: Check built docs links and metadata
        run: bun run check-site
        working-directory: docs

      - name: Copy WASM artifacts into docs output
        run: |
          unzip -q wasm-build/super-mango-wasm.zip -d wasm-build/unpacked
          cp wasm-build/unpacked/super-mango-wasm/super-mango{,-debug}.{html,js,wasm,data} docs/out/

      - name: Smoke Pages WASM assembly
        run: |
          test -s docs/out/super-mango.js
          test -s docs/out/super-mango.wasm
          test -s docs/out/super-mango.data
          grep -R "super-mango.js" docs/out/index.html
          python3 -m http.server 4173 --directory docs/out >/tmp/super-mango-pages.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for path in / /super-mango{,-debug}.{html,js,wasm,data}; do
            curl --retry 5 --retry-delay 1 --retry-connrefused -fsS "http://127.0.0.1:4173$path" >/dev/null
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/out/
          retention-days: 1

  pages-deploy:
    name: Pages deploy
    needs: pages-build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # One Pages deployment at a time; a newer main run waits, never cancels.
    concurrency:
      group: github-pages
      cancel-in-progress: false

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
