name: Build & Release

# ──────────────────────────────────────────────────────────────────────────────
# Triggers:
#   push → main    builds the game as a check only; no release is created.
#   pull_request   builds the game as a check only; no release is created.
#   push tag v*    builds and creates a GitHub Release for that tag.
#   workflow_dispatch builds and creates a manually versioned GitHub Release.
# ──────────────────────────────────────────────────────────────────────────────
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

  workflow_dispatch:
jobs:
  # ────────────────────────────────────────────────────────────────────────────
  # BUILD JOB
  # Compiles the game on Linux (x86_64), macOS (arm64), Windows (x86_64),
  # and WebAssembly in parallel.
  # Runs on every push to main AND every pull request.
  # ────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false   # let all platforms finish even if one fails
      matrix:
        include:
          - os: ubuntu-latest
            platform: Linux x86_64
            artifact: super-mango-linux-x86_64
            target: native
          - os: macos-latest
            platform: macOS arm64
            artifact: super-mango-macos-arm64
            target: native
          - os: windows-latest
            platform: Windows x86_64
            artifact: super-mango-windows-x86_64
            target: native
          - os: ubuntu-latest
            platform: WebAssembly
            artifact: super-mango-wasm
            target: wasm

    steps:
      # Check out the repository so the runner has access to the source code.
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      # ── Linux dependency install ────────────────────────────────────────────
      # apt packages: build tools + SDL2 and all companion library dev headers.
      - name: Install dependencies (Linux)
        if: matrix.target == 'native' && runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang \
            libsdl2-dev libsdl2-image-dev libsdl2-ttf-dev libsdl2-mixer-dev

      # ── macOS dependency install ────────────────────────────────────────────
      # Homebrew is pre-installed on macOS GitHub runners.
      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install sdl2 sdl2_image sdl2_ttf sdl2_mixer

      # ── Windows dependency install ──────────────────────────────────────────
      # MSYS2 is pre-installed on windows-latest runners. We use the
      # msys2/setup-msys2 action to configure the UCRT64 environment and
      # install MinGW-w64 gcc, make, and all SDL2 companion packages.
      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@e9898307ac31d1a803454791be09ab9973336e1c # v2
        with:
          msystem: UCRT64
          update: true
          install: >
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
            make
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-SDL2_image
            mingw-w64-ucrt-x86_64-SDL2_ttf
            mingw-w64-ucrt-x86_64-SDL2_mixer

      # ── Emscripten SDK install (WebAssembly) ────────────────────────────────
      # Provides emcc, the C-to-WebAssembly compiler. SDL2 ports are compiled
      # from source by Emscripten automatically via -s USE_SDL=2 flags.
      - name: Install Emscripten SDK
        if: matrix.target == 'wasm'
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 4.0.23

      - name: Verify Emscripten
        if: matrix.target == 'wasm'
        run: emcc --version

      - name: Install Node.js for WebAssembly smoke
        if: matrix.target == 'wasm'
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.21.1'

      # ── Compile (Linux / macOS) ─────────────────────────────────────────────
      # Produces out/super-mango via the project Makefile.
      - name: Build (Linux / macOS)
        if: matrix.target == 'native' && runner.os != 'Windows'
        run: make

      - name: Test (Linux / macOS)
        if: matrix.target == 'native' && runner.os != 'Windows'
        run: make test

      - name: Sanitizer tests (Linux)
        if: matrix.target == 'native' && runner.os == 'Linux'
        run: make sanitize

      - name: Validate levels (Linux / macOS)
        if: matrix.target == 'native' && runner.os != 'Windows'
        run: make validate-levels

      - name: Build editor (Linux / macOS)
        if: matrix.target == 'native' && runner.os != 'Windows'
        run: make editor

      - name: Smoke test (Linux / macOS)
        if: matrix.target == 'native' && runner.os != 'Windows'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: make smoke SMOKE_FRAMES=5 SMOKE_SEED=1

      - name: Scripted smoke scenarios (Linux)
        if: matrix.target == 'native' && runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: make scripted-smoke SMOKE_FRAMES=5 SMOKE_SEEDS="1 7 23"

      # ── Compile (Windows) ───────────────────────────────────────────────────
      # The msys2 shell is required so the UCRT64 toolchain and sdl2-config
      # are on PATH. We pass CC=gcc and override the output name to include
      # the .exe extension.
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make CC=gcc

      - name: Test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make test CC=gcc

      - name: Build editor (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make editor CC=gcc

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make smoke CC=gcc SMOKE_FRAMES=5 SMOKE_SEED=1

      # ── Compile (WebAssembly) ───────────────────────────────────────────────
      # Uses the 'web' Makefile target with emcc. Assets are bundled into
      # the .data file via --preload-file.
      - name: Build (WebAssembly)
        if: matrix.target == 'wasm'
        run: make web

      - name: Smoke test (WebAssembly artifacts)
        if: matrix.target == 'wasm'
        run: |
          test -f out/super-mango.html
          test -f out/super-mango.js
          test -f out/super-mango.wasm
          test -f out/super-mango.data
          test -s out/super-mango.wasm
          test -s out/super-mango.data
          node --check out/super-mango.js
          node -e "const fs=require('fs'); WebAssembly.compile(fs.readFileSync('out/super-mango.wasm')).then(()=>console.log('wasm compile ok'))"

      # ── Bundle SDL2 DLLs for Windows ────────────────────────────────────────
      # On Windows, SDL2 is dynamically linked. The DLLs must ship alongside
      # the .exe or it will fail to start on any machine without SDL2 installed.
      # We copy every SDL2*.dll from the UCRT64 bin directory into out/.
      - name: Bundle SDL2 DLLs (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: cp /ucrt64/bin/SDL2*.dll out/

      # ── Rename .exe for upload (Windows) ────────────────────────────────────
      # The Makefile produces "super-mango" on all platforms; on Windows the
      # linker names it "super-mango.exe". We normalise the name here so the
      # upload-artifact path is consistent.
      - name: Rename binary (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: mv out/super-mango.exe out/super-mango

      - name: Remove editor binary from release artifacts (Linux / macOS)
        if: matrix.target == 'native' && runner.os != 'Windows'
        run: rm -f out/super-mango-editor

      - name: Remove editor binary from release artifacts (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: rm -f out/super-mango-editor.exe out/super-mango-editor

      # Package standalone release archives. Native archives include the game
      # binary plus assets/, levels/, LICENSE, and a short run README so users
      # do not need to clone the repository just to play. WebAssembly archives
      # include the generated HTML/JS/WASM/data artifacts.
      - name: Package release archive (Linux / macOS)
        if: matrix.target == 'native' && runner.os != 'Windows'
        env:
          RELEASE_PLATFORM: ${{ matrix.artifact }}
        run: make dist-native

      - name: Package release archive (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        env:
          RELEASE_PLATFORM: ${{ matrix.artifact }}
          RELEASE_DLL_DIR: /ucrt64/bin
        run: make dist-native CC=gcc

      - name: Package release archive (WebAssembly)
        if: matrix.target == 'wasm'
        env:
          RELEASE_PLATFORM: ${{ matrix.artifact }}
        run: make dist-wasm

      # Upload the standalone zip as a workflow artifact. retention-days: 1 keeps
      # PR build storage low; releases immediately reattach the zip assets.
      - name: Upload release archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error
          retention-days: 1

  # ────────────────────────────────────────────────────────────────────────────
  # RELEASE JOB
  # Runs only for explicit release events: pushed v* tags or manual dispatch.
  # Waits for all four build matrix legs to succeed, then creates a GitHub
  # Release with the standalone platform archives attached.
  # ────────────────────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: build
    # Guard: skip normal branch pushes and PR checks. Publish only from v* tags
    # or an explicit manual workflow dispatch.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    # The GITHUB_TOKEN must have write access to repository contents to create
    # tags and releases. Scoping it here follows the principle of least privilege.
    permissions:
      contents: write

    steps:
      # Download each platform's artifact into its own subdirectory so files
      # with the same name ("super-mango") don't overwrite each other.
      - name: Download Linux binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: super-mango-linux-x86_64
          path: dist/linux/

      - name: Download macOS binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: super-mango-macos-arm64
          path: dist/macos/

      - name: Download Windows binary
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: super-mango-windows-x86_64
          path: dist/windows/

      - name: Download WebAssembly build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: super-mango-wasm
          path: dist/wasm/

      # Create the GitHub Release. The tag is auto-created by the action when
      # softprops/action-gh-release picks up GITHUB_TOKEN automatically.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: Super Mango ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          body: |
            Automated release built from commit [`${{ github.sha }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).

            ### Downloads

            | Platform        | File                                  | Notes                              |
            |-----------------|---------------------------------------|------------------------------------|
            | Linux x86_64    | `super-mango-linux-x86_64.zip`        | Extract zip and run `./super-mango` |
            | macOS arm64     | `super-mango-macos-arm64.zip`         | Extract zip and run `./super-mango` |
            | Windows x86_64  | `super-mango-windows-x86_64.zip`      | Extract zip; SDL2 DLLs are included |
            | WebAssembly     | `super-mango-wasm.zip`                | Serve with any HTTP server          |

            Native archives include the executable, `assets/`, `levels/`, `LICENSE`, and a short README. Run the executable from inside the extracted folder. Linux and macOS builds still require compatible SDL2 runtime libraries on the host. Windows archives bundle the SDL/MSYS2 runtime DLLs discovered by CI. The WebAssembly archive bundles assets into the `.data` file.
          files: |
            dist/linux/super-mango-linux-x86_64.zip
            dist/macos/super-mango-macos-arm64.zip
            dist/windows/super-mango-windows-x86_64.zip
            dist/wasm/super-mango-wasm.zip
          fail_on_unmatched_files: true
