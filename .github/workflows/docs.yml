name: Docs

on:
  pull_request:
    paths:
      - 'docs/**'
      - 'levels/**'
      - 'tools/check_docs_drift.py'
      - 'tools/check_roadmap_quality.py'
      - 'tools/generate_level_catalog.py'
      - 'tools/generate_overlay_snapshots.py'
      - 'tools/run_scripted_smoke.py'
      - '.gitattributes'
      - 'Makefile'
      - 'src/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:

jobs:
  docs:
    name: Docs lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Setup Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.21.1'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Check semantic docs drift
        run: make docs-drift

      - name: Install docs dependencies
        run: bun install --frozen-lockfile
        working-directory: docs

      - name: Lint docs
        run: bun run lint
        working-directory: docs

      - name: Build docs site
        run: bun run build
        working-directory: docs
