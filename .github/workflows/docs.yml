name: Docs

on:
  # Every main push runs the full docs check; PRs stay path-filtered. build.yml's
  # always-on "Docs drift" job runs `make docs-drift` on every PR and is the
  # recommended required status check (an owner ruleset setting).
  push:
    branches: [main]
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'PRODUCT.md'
      - 'DESIGN.md'
      - 'THIRD_PARTY_NOTICES.md'
      - 'assets/**'
      - 'tools/content_inventory.py'
      - 'levels/**'
      - 'tools/check_docs_drift.py'
      - 'tools/check_docs_site.py'
      - 'tools/web_csp.py'
      - 'tests/docs_checks_test.py'
      - 'tools/validate_levels.py'
      - 'tools/check_roadmap_quality.py'
      - 'tools/check_wasm_artifacts.py'
      - 'tools/generate_level_catalog.py'
      - 'tools/generate_overlay_snapshots.py'
      - 'tools/run_scripted_smoke.py'
      - 'docs/wiki/release-checklist.md'
      - '.gitattributes'
      - 'Makefile'
      - 'src/**'
      - '.github/workflows/*.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    name: Docs lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Check semantic docs drift
        run: make docs-drift

      - name: Install docs dependencies
        run: bun install --frozen-lockfile
        working-directory: docs

      - name: Lint docs
        run: bun run lint
        working-directory: docs

      - name: Audit docs dependencies
        run: bun audit
        working-directory: docs

      - name: Build docs site
        run: bun run build
        working-directory: docs

      - name: Check built docs links and metadata
        run: bun run check-site
        working-directory: docs
