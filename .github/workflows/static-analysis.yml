name: Static analysis

# clang-tidy over the project's own C code (src/ and tools/) with the checks
# in .clang-tidy: the Clang static analyzer, bugprone-* and a few CERT C
# rules. Informational: the findings go to the job summary and the job never
# fails because of them, so it is not a required check. CodeQL (codeql.yml)
# stays the gating analysis.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that PR's superseded run; main and
# manual runs are keyed by their unique run id and never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clang-tidy:
    name: clang-tidy (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAYLIB_ARCHIVE: .cache/raylib/source.tar.gz

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Ubuntu's clang-tidy matches its clang (18 on ubuntu-24.04).
      - name: Install dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y clang clang-tidy cmake libgl1-mesa-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          clang-tidy --version

      - name: Cache pinned raylib source archive
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/raylib
          key: raylib-source-${{ runner.os }}-${{ hashFiles('vendor/raylib/manifest.json', 'vendor/raylib/patches.json', 'tools/build_raylib.py') }}

      # The sources include raylib.h from the pinned build tree, so raylib is
      # built (or restored) first. Same fingerprint and exact-match key rules
      # as the caches in build.yml (see its sanitizers job).
      - name: Fingerprint the raylib toolchain
        id: toolchain
        run: echo "id=$({ echo "$ImageOS $ImageVersion $GITHUB_WORKSPACE"; clang --version; cmake --version; make -s raylib-options; } | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Cache compiled raylib
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            out/raylib
            !out/raylib/raylib-*/examples
            !out/raylib/raylib-*/projects
          key: raylib-build-linux-tidy-${{ steps.toolchain.outputs.id }}-${{ hashFiles('vendor/raylib/manifest.json', 'vendor/raylib/patches.json', 'tools/build_raylib.py') }}

      - name: Build pinned raylib
        run: make -j4 out/raylib/build/raylib/libraylib.a

      # `make tidy` writes compile_commands.json, then runs
      # tools/run_clang_tidy.py; --summary adds the findings table to this
      # run's summary page. continue-on-error keeps even a broken run (say,
      # a new clang-tidy that rejects the config) from failing the workflow.
      - name: Run clang-tidy
        continue-on-error: true
        run: |
          make compile-commands
          python3 tools/run_clang_tidy.py --summary "$GITHUB_STEP_SUMMARY"
