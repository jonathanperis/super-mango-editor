name: Static analysis

# clang-tidy over the project's own C code (src/ and tools/) with the checks
# in .clang-tidy: the Clang static analyzer, bugprone-* and a few CERT C
# rules. Informational: the findings go to the job summary and the job never
# fails because of them, so it is not a required check. CodeQL (codeql.yml)
# stays the gating analysis.
#
# Pull requests and manual runs only: a main push re-analysed the code its
# pull request had just analysed, and the raylib tree this job restores is
# saved by build.yml's main runs (same cache entry). Documentation-only pull
# requests are skipped, with the paths build.yml's changes job treats as
# docs-only; this workflow is not required, so a skipped run leaves no check
# waiting.
on:
  pull_request:
    paths-ignore:
      - 'docs/wiki/**'
      - 'docs/archive/**'
      - 'docs/README.md'
      - '.specs/**'
      - '.github/*.md'
      - '*.md'
  workflow_dispatch:

permissions:
  contents: read

# A new push to a pull request cancels that PR's superseded run; manual runs
# are keyed by their unique run id and never cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  clang-tidy:
    name: clang-tidy (informational)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAYLIB_ARCHIVE: .cache/raylib/source.tar.gz

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      # Ubuntu's clang-tidy matches its clang (18 on ubuntu-24.04).
      - name: Install dependencies
        uses: ./.github/actions/install-linux-deps
        with:
          extra: clang-tidy

      - name: Record the clang-tidy version
        run: clang-tidy --version

      # The sources include raylib.h from the pinned build tree, so raylib is
      # built (or restored) first. It is the same Linux clang debug tree as
      # the build workflow's Linux leg and CodeQL, under the same cache entry
      # (see the raylib-cache action), which build.yml's main runs save.
      - name: Cache raylib
        uses: ./.github/actions/raylib-cache
        with:
          variant: linux-clang-debug

      - name: Build pinned raylib
        run: make -j4 out/raylib/build/raylib/libraylib.a

      # `make tidy` writes compile_commands.json, then runs
      # tools/run_clang_tidy.py; --summary adds the findings table to this
      # run's summary page. continue-on-error keeps even a broken run (say,
      # a new clang-tidy that rejects the config) from failing the workflow.
      - name: Run clang-tidy
        continue-on-error: true
        run: |
          make compile-commands
          python3 tools/run_clang_tidy.py --summary "$GITHUB_STEP_SUMMARY"
