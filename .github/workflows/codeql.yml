name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# A new push to a pull request cancels that PR's superseded analysis; main,
# scheduled and manual runs are keyed by their unique run id and never
# cancelled, so main's code scanning results always complete.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (c-cpp)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake libgl1-mesa-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev

      - name: Build pinned third-party raylib before extraction
        run: make out/raylib/build/raylib/libraylib.a

      - name: Initialize CodeQL
        uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: c-cpp
          queries: security-and-quality

      - name: Build for CodeQL
        run: |
          make
          make editor

      # Analyze without uploading, then drop code-quality results that sit in
      # third-party code (raylib build headers under out/, vendored tomlc17
      # under vendor/). paths-ignore does not filter results for compiled
      # languages. Security results are kept everywhere; see the script.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: "/language:c-cpp"
          upload: never
          output: sarif-results

      - name: Filter third-party code-quality results
        run: python3 tools/filter_codeql_sarif.py sarif-results/*.sarif

      - name: Upload CodeQL results
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: sarif-results
          category: "/language:c-cpp"

  # Interpreted languages need no build: CodeQL extracts the sources directly.
  # Covers workflows, the Python build/docs tooling, and the web host/docs JS/TS.
  analyze-interpreted:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        language: [actions, python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          category: /language:${{ matrix.language }}
