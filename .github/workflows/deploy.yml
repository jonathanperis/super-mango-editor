name: Deploy to GitHub Pages

# ──────────────────────────────────────────────────────────────────────────────
# Triggers:
#   workflow_run → runs after Build & Release workflow completes successfully
#
# This workflow:
#   1. Downloads the WebAssembly build artifacts from the latest build
#   2. Builds the docs site (Astro)
#   3. Copies WASM files into docs output
#   4. Deploys to GitHub Pages
# ──────────────────────────────────────────────────────────────────────────────
on:
  workflow_run:
    workflows: ["Build & Release"]
    types:
      - completed
    branches:
      - main

permissions:
  pages: write
  id-token: write
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only run if the Build & Release workflow succeeded
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Download WebAssembly build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: super-mango-wasm
          path: wasm-build/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # Astro 7 checks process.versions.node during docs builds.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.9.0'

      # Bun installs the docs dependencies from the frozen lockfile.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - name: Install docs dependencies
        run: bun install --frozen-lockfile
        working-directory: docs

      - name: Build docs site
        run: bun run build
        working-directory: docs
        env:
          PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

      - name: Check built docs links and metadata
        run: bun run check-site
        working-directory: docs

      - name: Copy WASM artifacts into docs output
        run: |
          unzip -q wasm-build/super-mango-wasm.zip -d wasm-build/unpacked
          cp wasm-build/unpacked/super-mango-wasm/super-mango{,-debug}.{html,js,wasm,data} docs/out/

      - name: Smoke Pages WASM assembly
        run: |
          test -s docs/out/super-mango.js
          test -s docs/out/super-mango.wasm
          test -s docs/out/super-mango.data
          grep -R "super-mango.js" docs/out/index.html
          python3 -m http.server 4173 --directory docs/out >/tmp/super-mango-pages.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid' EXIT
          for path in / /super-mango{,-debug}.{html,js,wasm,data}; do
            curl --retry 5 --retry-delay 1 --retry-connrefused -fsS "http://127.0.0.1:4173$path" >/dev/null
          done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/out/
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
