name: Deploy to GitHub Pages

# ──────────────────────────────────────────────────────────────────────────────
# Triggers:
#   workflow_run → runs after Build & Release workflow completes successfully
#
# This workflow:
#   1. Downloads the WebAssembly build artifacts from the latest build
#   2. Builds the docs site (Astro)
#   3. Copies WASM files into docs output
#   4. Deploys to GitHub Pages
# ──────────────────────────────────────────────────────────────────────────────
on:
  workflow_run:
    workflows: ["Build & Release"]
    types:
      - completed
    branches:
      - main

permissions:
  pages: write
  id-token: write
  contents: read
  actions: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only run if the Build & Release workflow succeeded
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Download WebAssembly build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: super-mango-wasm
          path: wasm-build/
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      # Node 22 — Astro 6+ checks process.versions.node
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
        with:
          node-version: '22.21.1'

      # Bun for install (AGENTS.md convention for Pages projects)
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install docs dependencies
        run: bun install --frozen-lockfile
        working-directory: docs

      - name: Build docs site
        run: bun run build
        working-directory: docs
        env:
          PUBLIC_GA_ID: ${{ secrets.NEXT_PUBLIC_GA_ID }}

      - name: Copy WASM artifacts into docs output
        run: |
          unzip -q wasm-build/super-mango-wasm.zip -d wasm-build/unpacked
          cp wasm-build/unpacked/super-mango-wasm/super-mango.js   docs/out/
          cp wasm-build/unpacked/super-mango-wasm/super-mango.wasm docs/out/
          cp wasm-build/unpacked/super-mango-wasm/super-mango.data docs/out/
          cp wasm-build/unpacked/super-mango-wasm/super-mango-debug.html docs/out/ 2>/dev/null || true
          cp wasm-build/unpacked/super-mango-wasm/super-mango-debug.js   docs/out/ 2>/dev/null || true
          cp wasm-build/unpacked/super-mango-wasm/super-mango-debug.wasm docs/out/ 2>/dev/null || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/out/
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
